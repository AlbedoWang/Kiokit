[package]
name = "openanki-backend"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anki = { path = "anki/rslib", features = ["rustls"] }
anki_proto = { path = "anki/rslib/proto" }
base64 = "=0.22.1"
prost = "0.13"
prost-reflect = { version = "0.14.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
anki_proto = { path = "anki/rslib/proto" }
anki_proto_gen = { path = "anki/rslib/proto_gen" }
prost-reflect = "0.14.7"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
codegen-units = 16
